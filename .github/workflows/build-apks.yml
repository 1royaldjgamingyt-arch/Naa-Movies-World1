name: Build User and Admin APKs

on:
  workflow_dispatch:
  push:

jobs:
  build-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: ''

      - name: Accept Android SDK licenses
        run: |
          set +o pipefail
          yes | sdkmanager --licenses

      - name: Install required Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Verify Android SDK installation
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          ls -1 "${ANDROID_SDK_ROOT}/licenses" "${ANDROID_SDK_ROOT}/platforms" "${ANDROID_SDK_ROOT}/build-tools"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle Wrapper and project modules
        run: |
          chmod +x gradlew
          ./gradlew --version
          ./gradlew projects --no-daemon --console=plain

      - name: Ensure debug keystore exists
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build NAA MOVIES WORLD User App APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain

      - name: Build NAA MOVIES WORLD ADMIN App APK
        run: ./gradlew :admin:assembleDebug --no-daemon --stacktrace --console=plain

      - name: Verify generated APK outputs
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          ls -lh admin/build/outputs/apk/debug/admin-debug.apk

      - name: Upload NAA MOVIES WORLD APK (User App)
        uses: actions/upload-artifact@v4
        with:
          name: naa-movies-world-user-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload NAA MOVIES WORLD ADMIN APK (Admin App)
        uses: actions/upload-artifact@v4
        with:
          name: naa-movies-world-admin-apk
          path: admin/build/outputs/apk/debug/admin-debug.apk
          if-no-files-found: error
